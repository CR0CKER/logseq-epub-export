name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      # The offline tier. The live tier needs Logseq binaries and a display, so
      # it runs locally before every release (README -> Releasing).
      - name: Offline tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: |
          npm audit
          npm audit signatures
